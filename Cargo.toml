[package]
name = "kliknload"
version = "0.2.0"
edition = "2024"
description = "Click'n'Load receiver with pluggable outputs (pyLoad, HTTP, files, commands, clipboard)"
license = "MIT"
publish = false

[features]
default = ["gui"]
# Menu bar icon, settings window and clipboard. Disable for headless/Docker builds.
gui = ["dep:tray-icon", "dep:tao", "dep:arboard", "dep:resvg"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
form_urlencoded = "1.2.2"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies", "charset", "http2", "form", "system-proxy", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util", "fs"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

arboard = { version = "3.6.1", optional = true }
resvg = { version = "0.48.1", optional = true }
tao = { version = "0.37.1", optional = true }
tray-icon = { version = "0.26.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
